# Copy beside your concrete device YAML as secrets.yaml, then replace placeholders.
# Keep the real secrets.yaml ignored in the CONSUMING repository.

# Your existing Wi-Fi network credentials.
wifi_ssid: "Some_SSID"
wifi_password: "Some_WIFI_Password"

# A base64-encoded, randomly generated 32-byte key for the Home Assistant API.
# This base also uses it for encrypted ESPHome OTA uploads (no ota_password).
# Generate your own key using the command in README.md. Keep it for future uploads.
api_key: "<Generated API Key>"

# Password for the ESP's fallback Wi-Fi hotspot when it cannot join your network.
# Use 8-63 characters. This is separate from your normal Wi-Fi password.
ap_password: "Replace_With_AP_Password"

# Router and subnet for the device's static LAN address. Adjust for your network.
# Set device_ip_address in the device YAML to a suitable unused/reserved address.
gateway_address: "192.168.1.1"
subnet_mask: "255.255.255.0"

# Login for the ESP's local web interface.
web_server_user: $device_internal_name # Reuse internal name or use a literal username of your choice.
web_server_password: "Replace_With_Web_Password"
